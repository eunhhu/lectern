name: Lectern Multi-Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-and-server:
    name: "Core & Server (Bun Typecheck + E2E Tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: TypeScript strict typecheck
        run: bun run typecheck
      - name: Run Core & Server unit/E2E test suite
        run: bun test

  macos-native:
    name: "macOS Menu Bar App (Native SwiftUI/AppKit)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build & sign Lectern.app
        working-directory: apps/macos
        run: |
          chmod +x build-app.sh
          ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lectern-macOS-arm64
          path: apps/macos/Lectern-macOS-arm64.zip

  android-native:
    name: "Android App (Native Jetpack Compose + Quick Settings Tile)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Release APK
        working-directory: apps/android
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Lectern-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lectern-android-universal
          path: apps/android/Lectern-android-universal.apk

  windows-native:
    name: "Windows System Tray & Native Reader (.NET 8 WinForms)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file Windows executable
        working-directory: apps/windows
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist
          cp dist/LecternTray.exe LecternTray-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LecternTray-win-x64
          path: apps/windows/LecternTray-win-x64.exe

  release-and-cd:
    name: "Publish GitHub Release & Deploy to lectern.qucord.com"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [core-and-server, macos-native, android-native, windows-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or Update 'latest' GitHub Release with Native Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh release-assets/
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              release-assets/Lectern-macOS-arm64.zip \
              release-assets/Lectern-android-universal.apk \
              release-assets/LecternTray-win-x64.exe \
              --clobber
          else
            gh release create latest \
              release-assets/Lectern-macOS-arm64.zip \
              release-assets/Lectern-android-universal.apk \
              release-assets/LecternTray-win-x64.exe \
              --title "Lectern Native Clients & Core (Latest)" \
              --notes "Automated multi-platform build from commit ${{ github.sha }}"
          fi
      - name: Trigger Continuous Deployment on lectern.qucord.com
        env:
          DEPLOY_TOKEN: ${{ secrets.LECTERN_DEPLOY_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "Triggering CD webhook on https://lectern.qucord.com/api/cd/deploy ..."
          RESP=$(curl -fsSL -X POST https://lectern.qucord.com/api/cd/deploy \
            -H "X-Lectern-Deploy-Token: ${DEPLOY_TOKEN}")
          echo "CD response: ${RESP}"

          echo "Waiting for systemd restart and verifying deployed gitSha == ${EXPECTED_SHA} ..."
          for i in 1 2 3 4 5 6 7 8; do
            sleep 2
            HEALTH=$(curl -fsSL https://lectern.qucord.com/api/health || true)
            echo "Attempt ${i}: ${HEALTH}"
            if echo "${HEALTH}" | grep -q "${EXPECTED_SHA}"; then
              echo "✅ Verified production deployment at commit ${EXPECTED_SHA}"
              exit 0
            fi
          done
          echo "❌ Production gitSha did not match ${EXPECTED_SHA}"
          exit 1
