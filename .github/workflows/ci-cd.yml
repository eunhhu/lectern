name: Lectern Multi-Platform CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR supersedes its running checks; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the release job writes (to move the `latest` release).
permissions:
  contents: read

jobs:
  core-and-server:
    name: "Core & Server (Bun Typecheck + E2E Tests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3" # same Bun as production
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript strict typecheck
        run: bun run typecheck
      - name: Run Core & Server unit/E2E test suite
        run: bun test

  # The v2 web app (apps/web): pure-logic unit tests, the production build, and
  # Playwright + axe (WCAG 2.2 AA on the core screens, a keyboard-only upload-to-document
  # path, and a CSP stricter than production's). Not a deploy gate yet: /app is off in
  # production (LECTERN_WEB_SHELL=0).
  web:
    name: "Web App (Bun build + Playwright/axe)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3" # same Bun as production
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests (pairing, segment search, fixtures vs packages/domain)
        run: bun test apps/web
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Build and run Playwright + axe
        run: bun run web:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The server ships as soon as its own tests pass: it does not wait for (or depend on)
  # the slower native client builds below.
  deploy-server:
    name: "Deploy server to lectern.qucord.com"
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [core-and-server]
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the server changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ -z "${BEFORE}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")
          echo "${CHANGED}"
          if echo "${CHANGED}" | grep -Eq '^(apps/server/|apps/web/|apps/worker/|packages/|package\.json$|bun\.lock$|bunfig\.toml$|tsconfig\.json$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No server-side changes in this push; skipping the deploy."
          fi
      - name: Release this commit on the server
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.LECTERN_DEPLOY_TOKEN }}
        run: |
          # The server checks out exactly this commit (it must be on origin/main), runs
          # `bun install` only when dependencies changed, boots the new code against a
          # throwaway database, and rolls the checkout back on any failure before it ever
          # restarts. A commit that is already live (or older than the live one) is a no-op.
          RESP=$(curl -sS --max-time 300 -X POST https://lectern.qucord.com/api/cd/deploy \
            -H "X-Lectern-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "X-Lectern-Deploy-Sha: ${GITHUB_SHA}" \
            -w '\n%{http_code}')
          CODE=$(echo "${RESP}" | tail -n1)
          BODY=$(echo "${RESP}" | sed '$d')
          echo "CD response (${CODE}): ${BODY}"
          if [ "${CODE}" != "200" ] || [ "$(echo "${BODY}" | jq -r .ok)" != "true" ]; then
            echo "::error::Deploy webhook failed with HTTP ${CODE}"
            exit 1
          fi
      - name: Verify the release is live
        if: steps.changes.outputs.deploy == 'true'
        run: |
          # Running jobs get up to LECTERN_SHUTDOWN_GRACE_SEC (20s) before systemd restarts
          # the server, so allow about 90s for the new commit to answer.
          for i in $(seq 1 45); do
            LIVE=$(curl -fsS --max-time 10 https://lectern.qucord.com/api/health | jq -r .gitSha 2>/dev/null || true)
            if [ "${LIVE}" = "${GITHUB_SHA}" ]; then
              echo "✅ Production is live at ${LIVE}"
              exit 0
            fi
            if [ -n "${LIVE}" ] && [ "${LIVE}" != "null" ]; then
              git fetch --quiet origin main || true
              if git merge-base --is-ancestor "${GITHUB_SHA}" "${LIVE}" 2>/dev/null; then
                echo "✅ A newer release (${LIVE}) that includes ${GITHUB_SHA} is live"
                exit 0
              fi
            fi
            echo "Attempt ${i}: live=${LIVE:-unreachable}"
            sleep 2
          done
          echo "::error::Production did not come up at ${GITHUB_SHA}"
          exit 1

  macos-native:
    name: "macOS Menu Bar App (Native SwiftUI/AppKit)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build & sign Lectern.app
        working-directory: apps/macos
        run: |
          chmod +x build-app.sh
          ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lectern-macOS-arm64
          path: apps/macos/Lectern-macOS-arm64.zip

  android-native:
    name: "Android App (Native Jetpack Compose + Quick Settings Tile)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Release APK
        working-directory: apps/android
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Lectern-android-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lectern-android-universal
          path: apps/android/Lectern-android-universal.apk

  windows-native:
    name: "Windows System Tray & Native Reader (.NET 8 WinForms)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file Windows executable
        working-directory: apps/windows
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist
          cp dist/LecternTray.exe LecternTray-win-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LecternTray-win-x64
          path: apps/windows/LecternTray-win-x64.exe

  release-native-clients:
    name: "Publish GitHub Release (native clients)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos-native, android-native, windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish or update the 'latest' release at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh release-assets/
          NOTES="Automated multi-platform build from commit ${GITHUB_SHA}"
          if gh release view latest >/dev/null 2>&1; then
            # Keep the tag (and so the source archives) on the commit these binaries came from.
            git push --force origin "${GITHUB_SHA}:refs/tags/latest"
            gh release upload latest \
              release-assets/Lectern-macOS-arm64.zip \
              release-assets/Lectern-android-universal.apk \
              release-assets/LecternTray-win-x64.exe \
              --clobber
            gh release edit latest --notes "${NOTES}"
          else
            gh release create latest \
              release-assets/Lectern-macOS-arm64.zip \
              release-assets/Lectern-android-universal.apk \
              release-assets/LecternTray-win-x64.exe \
              --target "${GITHUB_SHA}" \
              --title "Lectern Native Clients & Core (Latest)" \
              --notes "${NOTES}"
          fi
